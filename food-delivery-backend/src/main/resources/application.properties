spring.application.name=food-delivery-03
server.port=8083
spring.profiles.active=prod

# --- Delivery fee pricing config (append to existing application.properties) ---
delivery.fee.base=2.50
delivery.fee.per-km=0.75
delivery.fee.free-threshold-km=3.0
delivery.max-radius-km=15.0

# --- Geocoding provider (OpenStreetMap Nominatim, no API key needed) ---
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org/search

# Appended to geocoding queries when not already present, to improve match
# rate for ambiguous city/street names. Leave blank to disable.
geocoding.default-country=India
