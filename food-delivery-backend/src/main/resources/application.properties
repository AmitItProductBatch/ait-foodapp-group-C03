
spring.application.name=food-delivery-03
server.port=8083
spring.profiles.active=local

# Delivery fee pricing config
delivery.fee.base=2.50
delivery.fee.per-km=0.75
delivery.fee.free-threshold-km=3.0
delivery.max-radius-km=15.0

# Geocoding provider
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org/search
geocoding.default-country=India

# Email configuration - Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=Your email
spring.mail.password=Your Email Passowoed
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
