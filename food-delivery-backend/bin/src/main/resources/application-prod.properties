# ==============================================================================
# Production Profile Configuration (Group 03 - Server IP: 194.242.57.93)
# ==============================================================================

# Server Configuration
server.port=8083

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:194.242.57.93}:${POSTGRES_PORT:5003}/${POSTGRES_DB:fooddelivery03}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================================
# Monitoring & Metrics Configuration (Grafana & Prometheus)
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.metrics.enabled=true
management.metrics.tags.application=${spring.application.name}

# ==============================================================================
# Logging Configuration (Loki & Logback)
# ==============================================================================
logging.level.root=INFO
logging.level.com.ait=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
loki.url=http://194.242.57.93:3100/loki/api/v1/push

# ==============================================================================
# Mailer / Portmailer Configuration
# ==============================================================================
spring.mail.host=194.242.57.93
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
